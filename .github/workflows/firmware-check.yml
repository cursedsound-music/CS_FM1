# SPDX-License-Identifier: GPL-3.0-only
# (cursedsound) the firmware alone, from any commit, by hand: Actions > firmware-check > Run workflow (ref: a branch, tag
# or commit). The package is a private download on the run's page. To tell a change of ours from a change of JieLi's
# toolchain (the link's layout is recorded against one compiler), build the upstream commit beside ours.
name: firmware-check
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        default: main
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout --detach "${{ inputs.ref }}" && git log -1 --format='%h %an %s'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow numpy fonttools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1-pinned
      - name: JieLi toolchain and SDK files
        run: |
          retry() { for d in 0 5 15 30 60; do sleep $d; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          ls -l "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"   # (BUILDING.md: the pinned SDK)
            cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin \
              /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout
          fi
      - name: the firmware
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          "$JIELI_TOOLCHAIN/pi32v2/bin/clang" --version | head -1
          python3 tools/build.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_id }}
          path: |
            build/felucca.fwsc
            build/felucca.bin
            build/layout.ld
            build/*.map
          if-no-files-found: ignore
          retention-days: 14
