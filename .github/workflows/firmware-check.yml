# SPDX-License-Identifier: GPL-3.0-only
# (cursedsound) the firmware alone, from any commit, by hand: Actions > firmware-check > Run workflow (ref: a branch, tag
# or commit). The package is a private download on the run's page. To tell a change of ours from a change of JieLi's
# toolchain (the link's layout is recorded against one compiler), build the upstream commit beside ours.
name: firmware-check
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        default: main
        required: true
      repin:
        description: "FELUCCA_REPIN: '' (the recorded layout), keep (the recorded order, the addresses anew) or 1"
        default: ""
        required: false
      compare:
        description: "Also compile this commit and print every recorded sound function whose size differs from it"
        default: ""
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout --detach "${{ inputs.ref }}" && git log -1 --format='%h %an %s'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow numpy fonttools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1-pinned
      - name: JieLi toolchain and SDK files
        run: |
          retry() { for d in 0 5 15 30 60; do sleep $d; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          ls -l "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"   # (BUILDING.md: the pinned SDK)
            cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin \
              /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout
          fi
      - name: the firmware
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          "$JIELI_TOOLCHAIN/pi32v2/bin/clang" --version | head -1
          export FELUCCA_REPIN="${{ inputs.repin }}"
          python3 tools/build.py || BUILD_FAIL=1
          if [ -s build/felucca.elf ]; then              # (cursed-os) where the image's bytes go: the biggest symbols, by file
            echo "----- the 250 biggest symbols (size, section, name) -----"
            "$JIELI_TOOLCHAIN/common/bin/objdump" -t build/felucca.elf | python3 -c "
          import sys
          r = []
          for ln in sys.stdin:
              p = ln.split()
              if len(p) >= 5:
                  try: r.append((int(p[-2], 16), p[-3], p[-1]))
                  except ValueError: pass
          for sz, sec, n in sorted(r)[-250:]: print(sz, sec, n)
          " || true
          fi
          [ -z "$BUILD_FAIL" ] || exit 1
          if [ -n "$FELUCCA_REPIN" ]; then
            echo "----- tools/audio_layout.txt as recorded (diff against the commit's) -----"
            git diff --stat -- tools/audio_layout.txt
            git diff -U0 -- tools/audio_layout.txt | grep -E '^[-+][0-9a-f]{6} ' | head -40
            echo "----- base64 of the recorded file -----"
            gzip -9c tools/audio_layout.txt | base64 -w0; echo
          fi
      - name: compare the sound's code with another commit
        if: always() && inputs.compare != ''
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          OD="$JIELI_TOOLCHAIN/common/bin/objdump"
          "$OD" -h build/felucca.o > /tmp/ours.h || true
          cp tools/audio_layout.txt /tmp/layout.txt
          git checkout -q --detach "${{ inputs.compare }}"
          FELUCCA_REPIN= python3 tools/build.py > /tmp/theirs.log 2>&1 || true
          "$OD" -h build/felucca.o > /tmp/theirs.h || true
          python3 - <<'PY'
          import re
          def secs(p):
              d = {}
              for ln in open(p):
                  m = re.match(r"\s*\d+\s+(\.\S+)\s+([0-9a-f]{8})\s", ln)
                  if m: d[m[1]] = int(m[2], 16)
              return d
          a, b = secs("/tmp/ours.h"), secs("/tmp/theirs.h")
          rows = [l.split() for l in open("/tmp/layout.txt") if l.strip() and not l.startswith("#")]
          tot = 0
          for off, flag, name in rows:
              if flag not in "@a-": continue
              x, y = a.get(".text." + name), b.get(".text." + name)
              if x != y:
                  print(f"{off} {flag} {name}: theirs {y} ours {x}")
                  if x is not None and y is not None: tot += x - y
          print("sum of the recorded functions' growth:", tot)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_id }}
          path: |
            tools/audio_layout.txt
            build/felucca.fwsc
            build/felucca.bin
            build/layout.ld
            build/*.map
          if-no-files-found: ignore
          retention-days: 14
